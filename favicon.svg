<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#0d5c6e"/>
  <!-- Concentric rings: a scattering pattern, and the initial S read as the gap. -->
  <g fill="none" stroke="#fbfaf7" stroke-width="2">
    <circle cx="16" cy="16" r="4"/>
    <circle cx="16" cy="16" r="9" stroke-dasharray="3.5 4.2"/>
  </g>
  <circle cx="16" cy="16" r="1.6" fill="#fbfaf7"/>
</svg>
